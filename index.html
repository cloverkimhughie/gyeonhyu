<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyeonhyu · 중국어 단어 학습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">GYEONHYU LANGUAGE</p>
        <h1>중국어 단어 학습</h1>
      </div>
      <button id="soundToggle" class="icon-btn" aria-label="소리 켜기">🔊</button>
    </header>

    <section class="stats">
      <div><span>진도</span><strong id="progressText">0 / 10</strong></div>
      <div><span>콤보</span><strong id="comboText">0</strong></div>
      <div><span>정답률</span><strong id="accuracyText">0%</strong></div>
    </section>

    <div class="progress-track"><div id="progressBar"></div></div>

    <section id="quiz" class="card">
      <div class="question-meta">
        <span id="questionType">중국어 → 한국어</span>
        <button id="speakBtn" class="speak-btn" title="발음 듣기">🔊 듣기</button>
      </div>
      <div id="prompt" class="prompt">你好</div>
      <div id="pinyin" class="pinyin">nǐ hǎo</div>

      <div id="answers" class="answers"></div>

      <form id="typingForm" class="typing-form hidden">
        <input id="typingInput" autocomplete="off" placeholder="정답을 입력하세요" />
        <button>확인</button>
      </form>

      <div id="feedback" class="feedback" aria-live="polite"></div>
      <button id="nextBtn" class="next-btn hidden">다음 문제 →</button>
    </section>

    <section class="session-note">
      <span>💡</span>
      <p>틀린 단어는 세션 마지막에 다시 풀 수 있어요.</p>
    </section>

    <section id="result" class="card result hidden">
      <div class="result-icon">🎉</div>
      <h2>학습 완료!</h2>
      <p id="resultSummary"></p>
      <div class="result-actions">
        <button id="reviewBtn" class="primary">오답 다시 학습</button>
        <button id="restartBtn" class="secondary">새 학습 시작</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
